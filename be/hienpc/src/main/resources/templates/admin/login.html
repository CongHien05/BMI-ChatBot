<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - BMI Chatbot</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <div class="login-container">
        <h1>🔐 Admin Login</h1>
        
        <div id="errorMessage" class="error-message alert alert-error"></div>
        <div id="loading" class="loading">⏳ Đang đăng nhập...</div>
        
        <form id="loginForm" class="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">📧 Email:</label>
                <input type="email" id="email" name="email" required 
                       placeholder="admin@example.com">
            </div>
            <div class="form-group">
                <label for="password">🔒 Mật khẩu:</label>
                <input type="password" id="password" name="password" required 
                       placeholder="Nhập mật khẩu">
            </div>
            <button type="submit" id="loginBtn" class="btn-login btn-primary">🚀 Đăng nhập</button>
        </form>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const loadingDiv = document.getElementById('loading');
            const loginBtn = document.getElementById('loginBtn');
            
            // Hide error, show loading
            errorDiv.style.display = 'none';
            loadingDiv.style.display = 'block';
            loginBtn.disabled = true;
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.token) {
                    // Lưu token vào cookie (để server có thể đọc)
                    document.cookie = `adminToken=${data.token}; path=/; max-age=86400`; // 24 hours
                    
                    // Cũng lưu vào localStorage để JavaScript có thể dùng
                    localStorage.setItem('adminToken', data.token);
                    localStorage.setItem('adminEmail', email);
                    
                    // Redirect đến dashboard
                    window.location.href = '/admin';
                } else {
                    // Hiển thị lỗi
                    errorDiv.textContent = data.message || 'Đăng nhập thất bại. Vui lòng kiểm tra lại email và mật khẩu.';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Lỗi kết nối. Vui lòng thử lại sau.';
                errorDiv.style.display = 'block';
            } finally {
                loadingDiv.style.display = 'none';
                loginBtn.disabled = false;
            }
        }
        
        // Kiểm tra nếu đã có token, redirect đến dashboard
        window.addEventListener('DOMContentLoaded', function() {
            // Không redirect nếu có parameter 'force' (truy cập trực tiếp để clear token cũ)
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('force') === 'true') {
                // Force show login page - clear any old tokens
                document.cookie = 'adminToken=; path=/; max-age=0';
                localStorage.removeItem('adminToken');
                localStorage.removeItem('adminEmail');
                // Hiển thị message
                const errorDiv = document.getElementById('errorMessage');
                errorDiv.textContent = 'Đã clear token cũ. Vui lòng đăng nhập lại.';
                errorDiv.className = 'alert alert-error';
                errorDiv.style.display = 'block';
                return;
            }

            // Kiểm tra cookie trước
            const cookies = document.cookie.split(';');
            let hasToken = false;
            for (let cookie of cookies) {
                if (cookie.trim().startsWith('adminToken=')) {
                    hasToken = true;
                    break;
                }
            }

            // Chỉ redirect nếu có cả token và adminEmail
            const token = localStorage.getItem('adminToken');
            const email = localStorage.getItem('adminEmail');

            if ((hasToken || token) && email) {
                // Có vẻ như đã login rồi, redirect về dashboard
                window.location.href = '/admin';
            } else {
                // Chưa login hoặc token không hợp lệ, clear token cũ
                document.cookie = 'adminToken=; path=/; max-age=0';
                localStorage.removeItem('adminToken');
                localStorage.removeItem('adminEmail');
            }
        });
    </script>
</body>
</html>
